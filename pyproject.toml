[project]
name = "secure-api"
version = "0.1.0"
description = "HDU Information Security Lab Work 1 Secure REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
]
