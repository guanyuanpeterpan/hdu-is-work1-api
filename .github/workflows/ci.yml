name: Secure REST API CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  security-and-quality-checks:
    name: Security Scanners & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"

      - name: Install Project Dependencies
        run: |
          uv sync

      - name: Run Automated Tests (pytest)
        run: |
          uv run pytest -v

      - name: Run Static Application Security Testing (SAST - Bandit)
        run: |
          uv run bandit -r app/ -v

      - name: Run Software Composition Analysis (SCA - pip-audit)
        run: |
          uv run pip-audit
